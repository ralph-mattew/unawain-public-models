name: validate-repo

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Validate structure and metadata
        run: python scripts/validate_repo.py --repo-root .

      - name: Build manifest (allow missing artifacts)
        run: python scripts/build_manifest.py --repo-root . --output models/model-manifest.json
